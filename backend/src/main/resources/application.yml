server:
  port: 8080

spring:
  application:
    name: lpf
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://example.supabase.co/auth/v1/.well-known/jwks.json}

lpf:
  cors:
    allowed-origins: ${LPF_CORS_ORIGINS:http://localhost:4200}
  supabase:
    issuer: ${SUPABASE_ISSUER:}

logging:
  level:
    org.springframework.security: INFO
    com.lpf: INFO
